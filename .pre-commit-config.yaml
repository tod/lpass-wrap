# Run `uv run pre-commit install` once, then these run on every commit.
# To run them across the whole repo: `uv run pre-commit run --all-files`.
---
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.18.2
    hooks:
      - id: mypy
        # Mirror the strict-mode config in pyproject.toml.  pre-commit runs
        # mypy in its own isolated venv, so the runtime dependencies have to be
        # named here or every import resolves to Any.
        additional_dependencies:
          - pydantic>=2.0
          - types-PyYAML
          - structlog
          - typer>=0.27.0
          - pytest>=8.0
        args: [--strict, --ignore-missing-imports]

  # A library whose purpose is handling credentials should scan its own
  # commits for them.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
